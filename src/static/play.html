<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<title>Musikquiz</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { min-height: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  header .logo { font-size: 28px; }
  header .team { font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-line); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { font-size: 48px; margin: 8px 0 6px; }
  h2 { font-size: 30px; margin: 0 0 4px; }
  p { line-height: 1.5; }
  .join { padding: 22px; margin-top: 24px; }
  .join label { display: block; font-weight: 600; margin-bottom: 8px; }
  .join input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--panel-line); background: rgba(0,0,0,.35); font-size: 18px; }
  .join .btn { width: 100%; margin-top: 14px; font-size: 18px; }
  .err { color: var(--bad); min-height: 1.4em; margin: 10px 0 0; font-size: 14px; }
  .wait { text-align: center; padding: 34px 18px; margin-top: 10px; }
  .wait .big { font-size: 40px; margin: 0 0 8px; }
  .eq { display: flex; gap: 5px; justify-content: center; height: 34px; align-items: flex-end; margin-bottom: 14px; }
  .eq span { width: 7px; border-radius: 4px; background: linear-gradient(var(--pink), var(--cyan)); animation: eq 1s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay: -.2s } .eq span:nth-child(3) { animation-delay: -.5s } .eq span:nth-child(4) { animation-delay: -.7s } .eq span:nth-child(5) { animation-delay: -.35s }
  @keyframes eq { 0%,100% { height: 20% } 50% { height: 100% } }
  @media (prefers-reduced-motion: reduce) { .eq span { animation: none; height: 60%; } }
  .roundhead { margin-bottom: 14px; }
  .roundhead .kicker { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
  .qlist { display: flex; flex-direction: column; gap: 12px; }
  .q { padding: 14px; }
  .q.current { border-color: rgba(255,63,180,.8); box-shadow: 0 0 0 1px rgba(255,63,180,.5), 0 0 22px rgba(255,63,180,.25); }
  .q .lbl { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; margin-bottom: 6px; }
  .q .lbl .st { font-weight: 600; font-size: 13px; color: var(--muted); }
  .q .txt { margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; min-height: 58px; border-radius: 12px;
         border: 1px solid var(--panel-line); background: rgba(0,0,0,.3); font-weight: 600; font-size: 15px; line-height: 1.25; cursor: pointer;
         -webkit-tap-highlight-color: transparent; transition: background .15s, border-color .15s; }
  .opt .L { font-family: var(--display); font-size: 26px; color: var(--cyan); flex: none; width: 18px; }
  .opt.sel { border-color: var(--pink); background: linear-gradient(90deg, rgba(255,63,180,.38), rgba(139,92,255,.3)); box-shadow: 0 0 16px rgba(255,63,180,.3); }
  .opt.sel .L { color: #fff; }
  .opt.right { border-color: var(--ok); background: rgba(51,227,154,.16); }
  .opt.right .L { color: var(--ok); }
  .opt.wrongpick { border-color: var(--bad); background: rgba(255,93,108,.14); }
  .opt:disabled { cursor: default; opacity: 1; color: var(--text); }
  .opts.small .opt { min-height: 44px; font-size: 13px; padding: 8px 10px; }
  .opts.small .opt .L { font-size: 20px; }
  .q .mine { font-size: 17px; font-weight: 600; }
  .q .facit { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .badge.ok { background: rgba(51,227,154,.15); }
  .badge.bad { background: rgba(255,93,108,.15); }
  .note { font-size: 14px; color: var(--muted); text-align: center; margin: 16px 0 0; }
  .rules { padding: 18px 18px 18px 40px; margin: 0; line-height: 1.5; }
  .rules li { margin: 6px 0; }
  .score { display: flex; flex-direction: column; gap: 8px; }
  .score .row { display: flex; gap: 12px; align-items: center; padding: 10px 14px; }
  .score .row.me { border-color: var(--pink); }
  .score .pl { font-family: var(--display); font-size: 26px; width: 34px; color: var(--cyan); }
  .score .nm { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score .pt { font-weight: 700; }
  .meplace { text-align: center; padding: 20px; margin-bottom: 14px; }
  .meplace .display { font-size: 64px; }
  .conn { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #3a1630; border: 1px solid var(--bad); color: #ffd1d6; padding: 8px 14px; border-radius: 999px; font-size: 13px; }
  .leave { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; display: block; margin: 28px auto 0; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo display grad">Musikquiz</div>
    <div class="team hidden" id="teamName"></div>
  </header>
  <div id="view"></div>
  <button class="leave hidden" id="leave">Byt lag / logga ut</button>
</main>
<div class="conn hidden" id="conn">Tappade anslutningen – försöker igen…</div>

<script>
const $ = (s) => document.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = null;
try { token = localStorage.getItem("mq_token"); } catch (e) {}
let state = null, version = 0, renderedKey = "", pollId = 0;

function setToken(t) {
  token = t;
  try { t ? localStorage.setItem("mq_token", t) : localStorage.removeItem("mq_token"); } catch (e) {}
}

async function poll(myId) {
  let delay = 1000;
  while (myId === pollId) {
    try {
      const r = await fetch(`/api/state?v=${version}&token=${encodeURIComponent(token || "")}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const s = await r.json();
      $("#conn").classList.add("hidden");
      delay = 1000;
      if (myId !== pollId) return;
      version = s.v;
      if (s.kicked) { setToken(null); }
      state = s;
      render();
    } catch (e) {
      $("#conn").classList.remove("hidden");
      await new Promise((res) => setTimeout(res, delay));
      delay = Math.min(delay * 2, 8000);
    }
  }
}
function restart() { pollId++; version = 0; poll(pollId); }

function render() {
  const s = state;
  $("#teamName").textContent = s.team ? s.team.name : "";
  $("#teamName").classList.toggle("hidden", !s.team);
  $("#leave").classList.toggle("hidden", !s.team);
  if (s.kind === "idle") {
    if (renderedKey === "idle") return;
    renderedKey = "idle";
    view.innerHTML = wait("Inget quiz just nu", "Quizmastern har inte startat något quiz ännu. Sidan uppdateras av sig själv.");
    return;
  }
  if (!token || !s.team) return renderJoin();

  if (s.kind === "question") return renderAnswering(s);
  // Bygg bara om vyn när innehållet ändrats, så att fokus och scroll ligger kvar.
  const key = JSON.stringify([s.kind, s.round, s.current, s.questions, s.scores, s.me]);
  if (key === renderedKey) return;
  renderedKey = key;

  const r = s.round;
  switch (s.kind) {
    case "soundcheck":
    case "lobby":
      view.innerHTML = wait(`Välkommen, ${esc(s.team.name)}!`, "Ni är anslutna. Quizet startar snart – titta på storskärmen.");
      break;
    case "rules":
      view.innerHTML = `<h2 class="display">Regler</h2><ol class="rules card">${s.rules.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>`;
      break;
    case "rounds":
      view.innerHTML = `<h2 class="display">Rundorna</h2><ol class="rules card">${s.rounds.map((x) => `<li><b>${esc(x.title)}</b> – ${x.count} frågor</li>`).join("")}</ol>`;
      break;
    case "round_intro":
      view.innerHTML = roundHead(r) + wait(r.instruction, "Frågorna dyker upp här en i taget. Ni kan ändra era svar ända tills rundan låses.");
      break;
    case "answers_intro":
    case "answer":
      view.innerHTML = roundHead(r, "Facit") +
        `<p class="note" style="margin:0 0 14px">Svaren är låsta. Facit visas på storskärmen.</p>` +
        `<div class="qlist">${s.questions.map((q) => resultCard(q, s.kind === "answer" && q.q === s.current)).join("")}</div>`;
      break;
    case "scores":
    case "final":
    case "thanks":
      view.innerHTML = scores(s);
      break;
    default:
      view.innerHTML = wait("Vänta…", "");
  }
}

function roundHead(r, extra) {
  return `<div class="roundhead"><div class="kicker">Runda ${r.n} av ${r.of}${extra ? " · " + extra : ""}</div>
    <h2 class="display">${esc(r.title)}</h2><div class="muted">${esc(r.instruction)}</div></div>`;
}
function wait(title, text) {
  return `<div class="wait card"><div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
    <p class="big display">${esc(title)}</p><p class="muted" style="margin:0">${esc(text)}</p></div>`;
}
const LETTERS = "ABCD";
function optionButtons(q, { chosen, disabled, small, reveal }) {
  return `<div class="opts ${small ? "small" : ""}" data-q="${q.q}">${q.options.map((o, i) => {
    const cls = [o === chosen ? "sel" : "", reveal && o === q.correctOption ? "right" : "", reveal && o === chosen && o !== q.correctOption ? "wrongpick" : ""].join(" ");
    return `<button class="opt ${cls}" data-o="${esc(o)}" ${disabled ? "disabled" : ""}><span class="L">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
  }).join("")}</div>`;
}
function resultCard(q, current) {
  const has = "facit" in q;
  const badge = has ? (q.correct ? `<span class="badge ok">✓ Rätt</span>` : `<span class="badge bad">✗ Fel</span>`) : `<span class="st">väntar på facit</span>`;
  const body = q.options
    ? optionButtons(q, { chosen: q.answer, disabled: true, small: !current, reveal: has }) + (q.answer ? "" : `<div class="facit">Ni svarade inte på den här.</div>`)
    : `<div class="mine">${q.answer ? esc(q.answer) : '<span class="muted">(inget svar)</span>'}</div>`;
  return `<div class="q card ${current ? "current" : ""}">
    <div class="lbl"><span>${esc(q.label)}</span>${badge}</div>
    ${q.text ? `<p class="txt muted">${esc(q.text)}</p>` : ""}
    ${body}
    ${has ? `<div class="facit">Facit: ${esc(q.facit)}</div>` : ""}
  </div>`;
}
function scores(s) {
  const title = s.kind === "scores" ? `Ställning efter runda ${s.round.n}` : "Slutresultat";
  const me = s.me ? `<div class="meplace card"><div class="muted">Ni ligger på plats</div>
      <div class="display grad">${s.me.place} av ${s.me.of}</div><div>${s.me.total} poäng</div></div>` : "";
  const rows = (s.scores || []).map((x) => `<div class="row card ${s.team && x.name === s.team.name ? "me" : ""}">
      <span class="pl">${x.place}</span><span class="nm">${esc(x.name)}</span><span class="pt">${x.total} p</span></div>`).join("");
  const thanks = s.kind === "thanks" ? `<p class="note">Tack för att ni spelade!</p>` : "";
  return `<h2 class="display">${title}</h2>${me}<div class="score">${rows}</div>${thanks}`;
}

// Svarsläget: korten byggs bara om när nya frågor tillkommer. Ett val som håller på att sparas
// visas direkt och skrivs inte över av ett äldre läge från servern.
const pending = {};
function renderAnswering(s) {
  const r = s.round;
  const key = JSON.stringify(["question", r.n, s.questions.map((q) => [q.q, q.text, q.options])]);
  if (key !== renderedKey) {
    renderedKey = key;
    const qs = [...s.questions].reverse();
    view.innerHTML = roundHead(r) + `<div class="qlist">${qs.map((q) => `
      <div class="q card ${q.q === s.current ? "current" : ""}">
        <div class="lbl"><span>${esc(q.label)}</span><span class="st" id="st-${q.q}"></span></div>
        ${q.text ? `<p class="txt">${esc(q.text)}</p>` : ""}
        ${optionButtons(q, { chosen: null, small: q.q !== s.current })}
      </div>`).join("")}</div>
      <p class="note">Tryck på det alternativ ni tror är rätt. Ni kan ändra er tills rundan låses.</p>`;
    view.querySelectorAll(".opts").forEach((box) => {
      const q = +box.dataset.q;
      box.querySelectorAll(".opt").forEach((btn) => btn.addEventListener("click", () => choose(r.n - 1, q, btn.dataset.o)));
    });
  }
  for (const q of s.questions) {
    const chosen = q.q in pending ? pending[q.q] : q.answer;
    view.querySelectorAll(`.opts[data-q="${q.q}"] .opt`).forEach((b) => b.classList.toggle("sel", b.dataset.o === chosen));
    const st = view.querySelector(`#st-${q.q}`);
    if (st && !(q.q in pending) && st.dataset.err !== "1") st.textContent = q.answer ? "✓ sparat" : "";
  }
}

function choose(r, q, option) {
  pending[q] = option;
  view.querySelectorAll(`.opts[data-q="${q}"] .opt`).forEach((b) => b.classList.toggle("sel", b.dataset.o === option));
  if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  save(r, q);
}
async function save(r, q) {
  const st = view.querySelector(`#st-${q}`);
  const option = pending[q];
  if (st) { st.textContent = "sparar…"; st.dataset.err = ""; }
  try {
    const res = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, r, q, text: option }) });
    const d = await res.json().catch(() => ({}));
    if (pending[q] !== option) return;          // ett nyare val är på väg
    delete pending[q];
    if (res.status === 401) { setToken(null); restart(); return; }
    if (!res.ok) { if (st) { st.textContent = d.error || "kunde inte spara"; st.dataset.err = "1"; } return; }
    if (st) st.textContent = "✓ sparat";
  } catch (e) {
    if (st) { st.textContent = "ej sparat – försöker igen"; st.dataset.err = "1"; }
    setTimeout(() => { if (pending[q] === option) save(r, q); }, 2000);
  }
}

function renderJoin() {
  if (renderedKey === "join") return;
  renderedKey = "join";
  view.innerHTML = `
    <h1 class="display grad">${esc(state && state.title ? state.title : "Välkommen till musikquizet!")}</h1>
    <p class="muted">Ett lag = en mobil. Skriv in ert lagnamn för att vara med.</p>
    <form class="join card" id="joinForm">
      <label for="name">Lagnamn</label>
      <input id="name" maxlength="30" autocomplete="off" autocapitalize="words" placeholder="T.ex. Bandet utan namn" required>
      <button class="btn" type="submit">Gå med</button>
      <p class="err" id="err"></p>
    </form>`;
  $("#joinForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    btn.disabled = true; $("#err").textContent = "";
    try {
      const res = await fetch("/api/join", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: $("#name").value }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || "Något gick fel.");
      setToken(d.token); renderedKey = ""; restart();
    } catch (err) {
      $("#err").textContent = err.message || "Kunde inte ansluta. Försök igen.";
      btn.disabled = false;
    }
  });
}

$("#leave").addEventListener("click", () => {
  if (confirm("Vill ni lämna laget på den här mobilen? Era svar finns kvar, men ni måste skapa ett nytt lagnamn för att fortsätta.")) {
    setToken(null); renderedKey = ""; restart();
  }
});
restart();
</script>
</body>
</html>
