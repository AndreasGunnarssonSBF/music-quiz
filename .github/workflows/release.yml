# Bygger Musikquiz för Mac (Apple Silicon) och Windows och lägger zip-filerna i en GitHub Release.
# Starta genom att pusha en tagg, t.ex.:  git tag v2.0 && git push origin v2.0
# Går också att köra för hand under Actions → Bygg och släpp → Run workflow (då blir det bara byggfiler, ingen release).
name: Bygg och släpp

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_server.py

  mac:
    needs: test
    runs-on: macos-latest
    # Frivillig Apple-signering: lägg in hemligheterna enligt docs/signering.md.
    # Saknas de byggs appen som vanligt (ad hoc-signerad).
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Importera Apple-certifikat
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          KC="$RUNNER_TEMP/bygg.keychain-db"; KP="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Bygg
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then unset MACOS_SIGN_IDENTITY; fi
          PYTHON="$(which python)" ./build/build_mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: Musikquiz-mac, path: dist/Musikquiz-mac.zip }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bygg
        run: powershell -ExecutionPolicy Bypass -File build\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: Musikquiz-windows, path: dist/Musikquiz-windows.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - name: Skapa release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dl/Musikquiz-mac.zip dl/Musikquiz-windows.zip \
            --title "Musikquiz $GITHUB_REF_NAME" --notes-file docs/release-notes.md
